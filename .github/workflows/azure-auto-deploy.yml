name: Automated Multi-Branch Stream Deployment

on:
  push:
    branches:
      - '*'            # Catch ABSOLUTELY ANY new or existing branch pushed by Jules
      - '!develop'     # PROTECT: Do not deploy if changes are pushed to develop
      - '!production'  # PROTECT: Do not deploy if changes are pushed to production
      - '!release-*'   # PROTECT: Do not deploy if changes are pushed to release lines

jobs:
  build-and-stream-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Setup Core .NET SDK Engine
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' # Tailor this to your nopCommerce target platform framework (e.g., 7.0.x or 8.0.x)

    # Step A: Compile and Publish on GitHub Cloud Servers (Bypasses Azure 1GB storage limits)
    - name: Pre-Compile nopCommerce Presentation Web Layer
      run: |
        dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj -c Release -o ${{ github.workspace }}/pre_compiled_output

    # Step B: Push raw pre-extracted code blocks directly to Azure wwwroot
    - name: Stream Raw Binary Structure to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'nop5' # !!! REPLACE THIS with your exact Azure Web App Name
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }} 
        package: '${{ github.workspace }}/pre_compiled_output' # Pushes folder contents, NOT a zip file