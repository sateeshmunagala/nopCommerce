name: Automated VPS Web Deploy

on:
  push:
    branches:
      - '**'           
      - '!develop'     
      - '!production'  
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restore Dependencies
      run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

    # 🛠️ Compiles the core binaries for Windows Hosting architectures
    - name: Compile and Publish Presentation Layer
      run: |
        dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj -c Release -r win-x86 --self-contained false -o ./publish /p:PublishReadyToRun=false /p:DebugSymbols=false /p:DebugType=None /p:CopyPluginDllsToOutput=false

    # 🧹 Clears out local heavy test binaries to optimize transit times
    - name: Purge Heavy Assets
      run: |
        if (Test-Path "./publish/Plugins") { Remove-Item -Path "./publish/Plugins" -Force -Recurse }
        Get-ChildItem -Path ./publish -Include *AllInterview.Tests* -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse
      shell: pwsh

    # 🚀 Streams files directly to your MilesWeb Plesk VPS with no memory ceilings!
    - name: Stream Core Assets to Plesk IIS
      uses: azure/webapps-deploy@v3
      with:
        publish-profile: ${{ secrets.PLESK_WEBDEPLOY_PROFILE }}
        package: ./publish
