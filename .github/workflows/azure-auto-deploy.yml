name: Automated VPS Web Deploy

on:
  push:
    branches:
      - '**'           
      - '!develop'     
      - '!production'  
  workflow_dispatch: 

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x' 

    - name: Restore Dependencies
      run: dotnet restore src/Presentation/Nop.Web/Nop.Web.csproj

    - name: Compile and Publish Presentation Layer
      run: |
        dotnet publish src/Presentation/Nop.Web/Nop.Web.csproj -c Release -r win-x86 --self-contained false -o ./publish /p:PublishReadyToRun=false /p:DebugSymbols=false /p:DebugType=None /p:CopyPluginDllsToOutput=false

    - name: Purge Heavy Assets
      run: |
        if (Test-Path "./publish/Plugins") { Remove-Item -Path "./publish/Plugins" -Force -Recurse }
        Get-ChildItem -Path ./publish -Include *AllInterview.Tests* -Recurse -ErrorAction SilentlyContinue | Remove-Item -Force -Recurse
      shell: pwsh

    # 🚀 Direct Native MSDeploy targeting your MilesWeb Plesk panel directly (Port 8172)
    - name: Execute Native MSDeploy to Plesk
      run: |
        # 1. Parse the Plesk XML Profile text explicitly
        $profileXml = [xml]'${{ secrets.PLESK_WEBDEPLOY_PROFILE }}'
        $publishProfile = $profileXml.publishData.publishProfile
        
        $siteName = $publishProfile.msdeploySite
        $userName = $publishProfile.userName
        $password = $publishProfile.userPWD
        $publishUrl = $publishProfile.publishUrl

        Write-Host "Connecting natively to Plesk MSDeploy Engine at: $publishUrl"

        # 2. Locate the native msdeploy.exe engine on the GitHub Windows Runner
        $msdeployPath = "${env:ProgramFiles}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        if (!(Test-Path $msdeployPath)) {
            $msdeployPath = "${env:ProgramFiles(x86)}\IIS\Microsoft Web Deploy V3\msdeploy.exe"
        }

        # 3. Fire the deployment package straight to your IIS server instance
        & $msdeployPath -source:contentPath="$(Get-Location)\publish" `
          -dest:contentPath="$siteName",ComputerName="$publishUrl",UserName="$userName",Password="$password",AuthType="Basic" `
          -verb:sync `
          -allowUntrusted
      shell: pwsh
